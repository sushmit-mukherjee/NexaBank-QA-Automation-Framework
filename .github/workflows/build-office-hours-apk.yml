name: Build Office Hours APK
on:
  push:
    branches:
      - tmp-office-hours-apk-build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: unzip -q OfficeHoursLogger-source-v1.1.zip
      - name: Build debug APK
        run: cd OfficeHoursLogger && gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: cp OfficeHoursLogger/app/build/outputs/apk/debug/app-debug.apk OfficeHours-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeHours-v1.1
          path: OfficeHours-v1.1.apk
